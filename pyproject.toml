[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labram"
version = "0.1.0"
description = "Large Brain Model for Learning Generic Representations with Tremendous EEG Data in BCI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "CC BY-NC 4.0" }
# Runtime dependencies (torch, timm, einops, h5py, pyhealth, scikit-learn,
# scipy, pandas, tensorboard, mne, numpy) intentionally not pinned here
# because the project relies on environment-specific torch builds. Use
# the README install instructions or your own environment manager.
dependencies = []

[project.optional-dependencies]
# radon + ruff power the design_reviewer skill's metrics
# (.claude/skills/design_reviewer/); they are dev-only tools.
dev = ["pytest>=7", "pyflakes", "radon", "ruff"]

[tool.setuptools.packages.find]
include = ["labram*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Lenient by design: this drives the design-review audit signal, it does not
# gate CI. Start with pyflakes (F) + a subset of pycodestyle (E) errors, and
# ignore line-length so wrapping style is not counted as noise.
select = ["E", "F"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
